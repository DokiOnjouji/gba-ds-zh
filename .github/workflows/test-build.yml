name: Test build (Linux aarch64)

# A device build from here rather than from the owner's machine: the same
# scripts/build-rocknix.sh a release is built from, uploaded as the run's
# artifact (dist/gba-ds-v<VERSION>-linux-aarch64.zip, for ROCKNIX, BananaOS
# and the Anbernic system).
#
# Run it by hand: Actions > Test build (Linux aarch64) > Run workflow. It
# builds the branch it is given (zh-cn by default), so this file can sit on
# main without the Chinese work having to carry it.
#
# A -dev VERSION also tries scripts/build-web.sh for the zip's web/ folder;
# without a wasi toolchain that step only warns, and the zip still comes out
# without web/gba-ds.wasm (the device doesn't use it).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: false
        default: zh-cn

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake zip unzip git pkg-config file
      - name: Toolchain and dependencies (cached)
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/build-rocknix.sh', 'scripts/mgba-options.sh', 'scripts/setup-host.sh') }}
      - name: Build
        env:
          GBADS_WEB_WORK: ${{ runner.temp }}/wasm
        run: scripts/build-rocknix.sh
      - name: The zip
        run: |
          ls -l dist/ || true
          ls dist/gba-ds-*-linux-aarch64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gba-ds-linux-aarch64
          path: dist/gba-ds-*-linux-aarch64.zip
          if-no-files-found: error
